name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests & build (ecommerce-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ecommerce-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + build (fails on warnings)
        run: npm run build
        env:
          CI: true

      - name: Unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ecommerce-app/coverage
          retention-days: 7

  backend-tests:
    name: Backend tests (Vitest + Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ecommerce-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Backend tests with coverage
        run: npm run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ecommerce-api/coverage
          retention-days: 7

  e2e-tests:
    name: E2E tests (Cypress)
    runs-on: ubuntu-latest
    needs: [unit-tests, backend-tests]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: 4000
      MONGODB_URI: mongodb://localhost:27017/ecommerce-db-ci
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_REFRESH_TOKEN: ci-jwt-refresh-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      CYPRESS_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend dependencies
        working-directory: ecommerce-api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ecommerce-app
        run: npm ci

      - name: Seed product catalog
        working-directory: ecommerce-api
        run: npm run seedProducts

      - name: Start backend API
        working-directory: ecommerce-api
        run: npm start &

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:4000/api/products --timeout 30000

      - name: Run Cypress against a freshly started frontend
        working-directory: ecommerce-app
        run: npm run test:e2e:ci

      - name: Upload Cypress videos & screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ecommerce-app/cypress/videos
            ecommerce-app/cypress/screenshots
          retention-days: 7
